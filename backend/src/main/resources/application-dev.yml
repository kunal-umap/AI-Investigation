spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ops_investigator}
    username: ${SPRING_DATASOURCE_USERNAME:ops_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ops_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.company.opsinvestigator: DEBUG
