spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:ops_investigator_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  kafka:
    listener:
      auto-startup: false

ops:
  kafka:
    enabled: false

logging:
  level:
    root: INFO
    com.company.opsinvestigator: DEBUG
