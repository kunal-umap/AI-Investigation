spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:ops_investigator_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  kafka:
    listener:
      auto-startup: false

logging:
  level:
    root: WARN
    com.company.opsinvestigator: INFO
