server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful

spring:
  application:
    name: ops-investigator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ops_investigator}}
    username: ${SPRING_DATASOURCE_USERNAME:ops_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ops_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OpsInvestigatorHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ops-investigator-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    properties:
      isolation.level: read_committed
      max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}

ops:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  detection:
    latency-threshold-ms: ${OPS_DETECTION_LATENCY_THRESHOLD_MS:1500}
    error-rate-threshold-pct: ${OPS_DETECTION_ERROR_RATE_THRESHOLD_PCT:5.0}
    connection-pool-threshold-pct: ${OPS_DETECTION_CONNECTION_POOL_THRESHOLD_PCT:85.0}
    deadlocks-threshold: ${OPS_DETECTION_DEADLOCKS_THRESHOLD:1}
    cpu-threshold-pct: ${OPS_DETECTION_CPU_THRESHOLD_PCT:85.0}
    memory-threshold-pct: ${OPS_DETECTION_MEMORY_THRESHOLD_PCT:85.0}
    disk-threshold-pct: ${OPS_DETECTION_DISK_THRESHOLD_PCT:85.0}
    recent-deployment-window-minutes: ${OPS_DETECTION_DEPLOYMENT_WINDOW_MINUTES:15}
  correlation:
    window-minutes: ${OPS_CORRELATION_WINDOW_MINUTES:15}

  jackson:
    time-zone: UTC
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
