version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-investigator-postgres
    environment:
      POSTGRES_DB: ops_investigator
      POSTGRES_USER: ops_user
      POSTGRES_PASSWORD: ops_secret
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_user -d ops_investigator"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ops-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ops-investigator-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ops-network

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ops-investigator-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # Block until Kafka is reachable
      kafka-topics --bootstrap-server kafka:29092 --list

      echo -e 'Creating standard topics, retry topics, and dead-letter queues...'
      for topic in ops.telemetry.logs ops.telemetry.metrics ops.telemetry.db ops.incident.detected ops.incident.updated ops.change.detected ops.investigation.requested ops.investigation.completed; do
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --replication-factor 1 --partitions 3
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $${topic}.retry --replication-factor 1 --partitions 3
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $${topic}.DLT --replication-factor 1 --partitions 3
      done

      echo -e 'Successfully initialized all investigation Kafka topics.'
      "
    networks:
      - ops-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ops-investigator-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-ops-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ops-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ops-investigator-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ops_investigator
      SPRING_DATASOURCE_USERNAME: ops_user
      SPRING_DATASOURCE_PASSWORD: ops_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ops-network

networks:
  ops-network:
    driver: bridge

volumes:
  postgres-data:
